services:
  marksapi:
    build:
      context: ../../.
      dockerfile: ./cli/build/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT}
      secrets:
        - GITHUB_USER
        - GITHUB_PAT
    image: ghcr.io/hoeyi/marksapi:latest
    user: ${CUID-0}:${CGID-0}
    volumes:
    - ${HOME}/marksapi:/app/data
    secrets:
        - MASSIVE_API_KEY

secrets:
  MASSIVE_API_KEY:
    file: ${HOME}/.docker-secrets/massive_api_key.txt   
  GITHUB_USER:
    environment: GITHUB_USER
  GITHUB_PAT:
    environment: GITHUB_PAT      