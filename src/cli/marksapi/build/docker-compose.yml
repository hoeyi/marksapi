services:
  marksapi:
    build:
      context: ../../../.
      dockerfile: ./cli/marksapi/build/Dockerfile
      secrets:
        - GITHUB_USER
        - GITHUB_PAT
    image: ghcr.io/hoeyi/marksapi:latest
    volumes:
    - ${HOME}/marksapi:/app/data
    secrets:
        - MASSIVE_API_KEY

secrets:
  MASSIVE_API_KEY:
    file: ${HOME}/.docker-secrets/massive_api_key.txt   
  GITHUB_USER:
    environment: GITHUB_USER
  GITHUB_PAT:
    environment: GITHUB_PAT      